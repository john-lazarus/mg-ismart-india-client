[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mg-ismart-india-client"
version = "0.1.7"
description = "Python client for the MG iSMART India TAP/gateway API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Lazarus" }]
keywords = ["mg", "ismart", "india", "saic", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiohttp>=3.9",
  "asn1tools>=0.167.0",
  "pycryptodome>=3.20.0",
]

[project.urls]
Homepage = "https://github.com/john-lazarus/mg-ismart-india-client"
Issues = "https://github.com/john-lazarus/mg-ismart-india-client/issues"
Source = "https://github.com/john-lazarus/mg-ismart-india-client"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mg_ismart_india_client"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
